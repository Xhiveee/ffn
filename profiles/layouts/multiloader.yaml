# Layout used by create_project layout=multiloader (MultiLoader-Template style, no extra runtime dependency).
#
# FFN deviates from the single-Gradle-build MultiLoader-Template on purpose: the loaders' Gradle plugins need
# different Gradle versions (e.g. ForgeGradle 6 on Gradle 8.x vs Loom 1.1x/ModDevGradle on Gradle 9), so one
# build cannot host every loader/version combination. Each loader is an independent Gradle build (own wrapper)
# in its own subdirectory and compiles the shared common/ tree as an extra source directory.
# A user file with the same path under $FFN_PROFILES_DIR/layouts/ replaces this one.

commonDir: common

# Loader sets used when the caller does not pass `loaders`. Rules are checked in order; first match wins.
defaults:
  - since: "1.20.1"
    until: "1.20.1"
    loaders: [fabric, forge]
    note: "NeoForge 1.20.1 is a Forge fork (net.neoforged:forge); Forge is the usual second target there."
  - since: "1.20.2"
    loaders: [fabric, neoforge]

# Appended to every loader build script (Groovy DSL). {{common}} is the relative path to the common dir.
buildScriptAppend: |

  // ---- FFN multiloader: shared loader-independent code and resources ----
  sourceSets.main.java.srcDir '{{common}}/src/main/java'
  sourceSets.main.resources.srcDir '{{common}}/src/main/resources'
  tasks.withType(ProcessResources).configureEach { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

# Files under these prefixes that every loader generates identically are moved into common/.
sharedPrefixes:
  - src/main/resources/assets/
  - src/main/resources/data/
