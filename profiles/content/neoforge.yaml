# FFN content catalog — NeoForge.
# NeoForge 1.20.1 is a Forge 47 fork (net.minecraftforge packages): it is delegated to the forge catalog.
# 1.20.2+: net.neoforged DeferredRegister/DeferredHolder, IEventBus constructor parameter, NeoForge.EVENT_BUS,
# RegisterPayloadHandlersEvent payloads (1.20.5+), ModConfigSpec. API differences between 1.21.x and 26.x
# (FMLEnvironment.dist → getDist(), ClientPacketDistributor, GatherDataEvent.Client, BreakBlockEvent) are probed.
loader: neoforge

delegate:
  - if: "has.legacyForgePackages"
    to: forge

main:
  init: constructor
  modBus:
    - param: net.neoforged.bus.api.IEventBus
      expr: "{{param}}"
    - expr: "{{@net.neoforged.fml.javafmlmod.FMLJavaModLoadingContext}}.get().getModEventBus()"
      requires: ["net.neoforged.fml.javafmlmod.FMLJavaModLoadingContext#getModEventBus"]

symbols:
  ModBus: net.neoforged.bus.api.IEventBus
  DeferredRegister: net.neoforged.neoforge.registries.DeferredRegister
  Holder: net.neoforged.neoforge.registries.DeferredHolder
  NeoForge: net.neoforged.neoforge.common.NeoForge
  FMLEnvironment: net.neoforged.fml.loading.FMLEnvironment
  Dist: net.neoforged.api.distmarker.Dist
  EntityAttributeCreationEvent: net.neoforged.neoforge.event.entity.EntityAttributeCreationEvent
  RegisterRenderers: net.neoforged.neoforge.client.event.EntityRenderersEvent$RegisterRenderers
  RegisterPayloadHandlersEvent: net.neoforged.neoforge.network.event.RegisterPayloadHandlersEvent
  IPayloadContext: net.neoforged.neoforge.network.handling.IPayloadContext
  PacketDistributor: net.neoforged.neoforge.network.PacketDistributor
  ClientPacketDistributor: net.neoforged.neoforge.client.network.ClientPacketDistributor
  ConfigSpec: net.neoforged.neoforge.common.ModConfigSpec
  ModConfig: net.neoforged.fml.config.ModConfig
  ModLoadingContext: net.neoforged.fml.ModLoadingContext
  ServerTickEventPost: net.neoforged.neoforge.event.tick.ServerTickEvent$Post
  ServerStartedEvent: net.neoforged.neoforge.event.server.ServerStartedEvent
  PlayerLoggedInEvent: net.neoforged.neoforge.event.entity.player.PlayerEvent$PlayerLoggedInEvent
  BreakEvent: [net.neoforged.neoforge.event.level.block.BreakBlockEvent, net.neoforged.neoforge.event.level.BlockEvent$BreakEvent]
  RegisterCommandsEvent: net.neoforged.neoforge.event.RegisterCommandsEvent
  GatherDataEvent: net.neoforged.neoforge.data.event.GatherDataEvent
  GatherDataClient: net.neoforged.neoforge.data.event.GatherDataEvent$Client
  LanguageProvider: net.neoforged.neoforge.common.data.LanguageProvider
  PackOutput: net.minecraft.data.PackOutput

probes:
  legacyForgePackages: "net.minecraftforge.registries.DeferredRegister"
  tabBuilderNoArg: "net.minecraft.world.item.CreativeModeTab#builder()"
  distGetter: "net.neoforged.fml.loading.FMLEnvironment#getDist()"
  clientPacketDistributor: "net.neoforged.neoforge.client.network.ClientPacketDistributor#sendToServer("
  gatherClient: "net.neoforged.neoforge.data.event.GatherDataEvent$Client"
  cfgTypeCommon: "net.neoforged.fml.config.ModConfig$Type#COMMON"
  cfgTypeServer: "net.neoforged.fml.config.ModConfig$Type#SERVER"
  neoPayloadRegistrar: "net.neoforged.neoforge.network.event.RegisterPayloadHandlersEvent#registrar("

tables:
  configTypes:
    int:
      valueType: "{{@ConfigSpec}}.IntValue"
      define: 'defineInRange("{{this.name}}", {{this.defaultLiteral}}, {{#if this.hasRange}}{{this.min}}, {{this.max}}{{else}}Integer.MIN_VALUE, Integer.MAX_VALUE{{/if}})'
    long:
      valueType: "{{@ConfigSpec}}.LongValue"
      define: 'defineInRange("{{this.name}}", {{this.defaultLiteral}}L, {{#if this.hasRange}}{{this.min}}L, {{this.max}}L{{else}}Long.MIN_VALUE, Long.MAX_VALUE{{/if}})'
    double:
      valueType: "{{@ConfigSpec}}.DoubleValue"
      define: 'defineInRange("{{this.name}}", {{this.defaultLiteral}}, {{#if this.hasRange}}{{this.min}}, {{this.max}}{{else}}-Double.MAX_VALUE, Double.MAX_VALUE{{/if}})'
    bool:
      valueType: "{{@ConfigSpec}}.BooleanValue"
      define: 'define("{{this.name}}", {{this.defaultLiteral}})'
    string:
      valueType: "{{@ConfigSpec}}.ConfigValue<String>"
      define: 'define("{{this.name}}", {{this.defaultLiteral}})'
  events:
    server_tick:
      variants:
        - requires: ["net.neoforged.neoforge.event.tick.ServerTickEvent$Post#getServer"]
          register: "{{@NeoForge}}.EVENT_BUS.addListener(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@ServerTickEventPost}} event) {
                // End of every server tick (20 per second): keep it cheap.
            }
    server_started:
      variants:
        - requires: ["net.neoforged.neoforge.event.server.ServerStartedEvent#getServer"]
          register: "{{@NeoForge}}.EVENT_BUS.addListener(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@ServerStartedEvent}} event) {
                {{@Main}}.LOGGER.info("[{{modId}}] server started");
            }
    player_join:
      variants:
        - requires: ["net.neoforged.neoforge.event.entity.player.PlayerEvent$PlayerLoggedInEvent#getEntity"]
          register: "{{@NeoForge}}.EVENT_BUS.addListener(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@PlayerLoggedInEvent}} event) {
                {{@Main}}.LOGGER.info("[{{modId}}] {} joined", event.getEntity().getName().getString());
            }
    block_break:
      variants:
        - requires: ["net.neoforged.neoforge.event.level.block.BreakBlockEvent#getPlayer"]
          register: "{{@NeoForge}}.EVENT_BUS.addListener(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@BreakEvent}} event) {
                // React to the block being broken (event.getPos(), event.getState(), event.getPlayer()).
            }
        - requires: ["net.neoforged.neoforge.event.level.BlockEvent$BreakEvent#getPlayer"]
          register: "{{@NeoForge}}.EVENT_BUS.addListener(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@BreakEvent}} event) {
                // React to the block being broken (event.getPos(), event.getState(), event.getPlayer()).
            }
    register_commands:
      variants:
        - requires: ["net.neoforged.neoforge.event.RegisterCommandsEvent#getDispatcher", "net.minecraft.commands.CommandSourceStack#sendSuccess(Ljava/util/function/Supplier;Z)V"]
          register: "{{@NeoForge}}.EVENT_BUS.addListener(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@RegisterCommandsEvent}} event) {
                event.getDispatcher().register({{@Commands}}.literal("{{modId}}").executes(context -> {
                    context.getSource().sendSuccess(() -> {{@Component}}.literal("Hello from {{modId}}"), false);
                    return 1;
                }));
            }
  java:
    id: |
      public static {{@Id}} id(String path) {
          return {{#if has.idCtor}}new {{@Id}}("{{modId}}", path){{else}}{{@Id}}.fromNamespaceAndPath("{{modId}}", path){{/if}};
      }
    configTypeConstant: '{{#eq params.configType "common"}}{{#if has.cfgTypeCommon}}COMMON{{else}}LOCAL{{/if}}{{else}}{{#eq params.configType "server"}}{{#if has.cfgTypeServer}}SERVER{{else}}SYNCED{{/if}}{{else}}{{params.CONFIG_TYPE}}{{/eq}}{{/eq}}'
    distClient: "{{@FMLEnvironment}}.{{#if has.distGetter}}getDist(){{else}}dist{{/if}} == {{@Dist}}.CLIENT"

kinds:
  _blocks_container:
    ops:
      - insert: "{{javaDir}}/registry/ModBlocks.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: blocks (NeoForge DeferredRegister). */
          public final class ModBlocks {
              public static final {{@DeferredRegister}}<{{@Block}}> BLOCKS = {{@DeferredRegister}}.create({{@Registries}}.BLOCK, "{{modId}}");
              // ffn:fields

              private ModBlocks() {}

              public static void register({{@ModBus}} bus) {
                  BLOCKS.register(bus);
              }

              private static <T extends {{@Block}}> {{@Holder}}<{{@Block}}, T> register(String name, {{@Function}}<{{@BlockProps}}, T> factory, {{@BlockProps}} props, boolean withItem) {
                  {{@Holder}}<{{@Block}}, T> block = BLOCKS.register(name, () -> factory.apply(props{{#if has.blockPropsSetId}}.setId({{@ResourceKey}}.create({{@Registries}}.BLOCK, ModItems.id(name))){{/if}}));
                  if (withItem) ModItems.registerBlockItem(name, block);
                  return block;
              }
          }
      - hook: main
        text: "{{@~.registry.ModBlocks}}.register({{modBus}});"
      - include: _items_container

  _items_container:
    ops:
      - insert: "{{javaDir}}/registry/ModItems.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: items (NeoForge DeferredRegister). */
          public final class ModItems {
              public static final {{@DeferredRegister}}<{{@Item}}> ITEMS = {{@DeferredRegister}}.create({{@Registries}}.ITEM, "{{modId}}");
              // ffn:fields

              private ModItems() {}

              public static void register({{@ModBus}} bus) {
                  ITEMS.register(bus);
              }

          {{> tables.java.id}}
              public static {{@Holder}}<{{@Item}}, {{@Item}}> registerBlockItem(String name, {{@Supplier}}<? extends {{@Block}}> block) {
                  return register(name, props -> new {{@BlockItem}}(block.get(), props), new {{@ItemProps}}(){{#if has.itemBlockDescription}}.useBlockDescriptionPrefix(){{/if}});
              }

              public static <T extends {{@Item}}> {{@Holder}}<{{@Item}}, T> register(String name, {{@Function}}<{{@ItemProps}}, T> factory, {{@ItemProps}} props) {
                  return ITEMS.register(name, () -> factory.apply(props{{#if has.itemPropsSetId}}.setId({{@ResourceKey}}.create({{@Registries}}.ITEM, id(name))){{/if}}));
              }
          }
      - hook: main
        text: "{{@~.registry.ModItems}}.register({{modBus}});"

  _tab_entry:
    ops:
      - if: params.tab
        insert: "{{javaDir}}/registry/ModCreativeTabs.java"
        id: creative tab (generate kind=creative_tab first)
        at:
          - marker: "tab_{{params.tab}}"
            text: 'output.accept({{#eq kind "item"}}ModItems{{else}}ModBlocks{{/eq}}.{{NAME}}.get());'

  block:
    description: "A simple block with its block item, blockstate, models, texture, loot table and translation"
    ops:
      - include: _blocks_container
      - insert: "{{javaDir}}/registry/ModBlocks.java"
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Holder}}<{{@Block}}, {{@Block}}> {{NAME}} = register("{{name}}", {{@Block}}::new, {{@BlockProps}}.of().strength({{#if params.strength}}{{params.strength}}{{else}}1.5{{/if}}f){{#if params.lightLevel}}.lightLevel(state -> {{params.lightLevel}}){{/if}}, true);
      - include: block_assets
      - include: _tab_entry

  item:
    description: "A simple item with model, texture and translation"
    ops:
      - include: _items_container
      - insert: "{{javaDir}}/registry/ModItems.java"
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Holder}}<{{@Item}}, {{@Item}}> {{NAME}} = register("{{name}}", {{@Item}}::new, new {{@ItemProps}}(){{#if params.stackSize}}.stacksTo({{params.stackSize}}){{/if}});
      - include: item_assets
      - include: _tab_entry

  creative_tab:
    description: "A creative mode tab listing items (params.items, params.icon); later blocks/items can join it with params.tab"
    ops:
      - insert: "{{javaDir}}/registry/ModCreativeTabs.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: creative mode tabs (NeoForge DeferredRegister). */
          public final class ModCreativeTabs {
              public static final {{@DeferredRegister}}<{{@CreativeModeTab}}> TABS = {{@DeferredRegister}}.create({{@Registries}}.CREATIVE_MODE_TAB, "{{modId}}");
              // ffn:fields

              private ModCreativeTabs() {}

              public static void register({{@ModBus}} bus) {
                  TABS.register(bus);
              }

              private static {{@Item}} item(String id) {
                  return {{@BuiltInRegistries}}.ITEM.{{#if has.registryGetValue}}getValue{{else}}get{{/if}}({{@Id}}.tryParse(id));
              }
          }
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Holder}}<{{@CreativeModeTab}}, {{@CreativeModeTab}}> {{NAME}} = TABS.register("{{name}}", () -> {{@CreativeModeTab}}.builder({{#unless has.tabBuilderNoArg}}{{@CreativeModeTab}}.Row.TOP, 0{{/unless}})
                      .title({{@Component}}.translatable("itemGroup.{{modId}}.{{name}}"))
                      .icon(() -> new {{@ItemStack}}(item("{{#if params.icon}}{{params.icon}}{{else}}minecraft:book{{/if}}")))
                      .displayItems((parameters, output) -> {
              {{#each params.items}}            output.accept(item("{{this.id}}"));
              {{/each}}            // ffn:tab_{{name}}
                      })
                      .build());
      - hook: main
        text: "{{@~.registry.ModCreativeTabs}}.register({{modBus}});"
      - lang: { "itemGroup.{{modId}}.{{name}}": "{{displayName}}" }

  block_entity:
    description: "A block with a ticking block entity that persists a counter"
    ops:
      - include: _blocks_container
      - include: _be_classes
      - insert: "{{javaDir}}/registry/ModBlocks.java"
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Holder}}<{{@Block}}, {{@Block}}> {{NAME}} = register("{{name}}", {{@~.block.[Name]Block}}::new, {{@BlockProps}}.of().strength(2.0f), true);
      - insert: "{{javaDir}}/registry/ModBlockEntities.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: block entity types (NeoForge DeferredRegister). */
          public final class ModBlockEntities {
              public static final {{@DeferredRegister}}<{{@BlockEntityType}}<?>> BLOCK_ENTITIES = {{@DeferredRegister}}.create({{@Registries}}.BLOCK_ENTITY_TYPE, "{{modId}}");
              // ffn:fields

              private ModBlockEntities() {}

              public static void register({{@ModBus}} bus) {
                  BLOCK_ENTITIES.register(bus);
              }
          }
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Holder}}<{{@BlockEntityType}}<?>, {{@BlockEntityType}}<{{@~.block.[Name]BlockEntity}}>> {{NAME}} = BLOCK_ENTITIES.register("{{name}}",
                      () -> {{#if has.beTypeCtor}}new {{@BlockEntityType}}<>({{@~.block.[Name]BlockEntity}}::new, {{@Set}}.of(ModBlocks.{{NAME}}.get())){{else}}{{@BlockEntityType}}.Builder.of({{@~.block.[Name]BlockEntity}}::new, ModBlocks.{{NAME}}.get()).build(null){{/if}});
      - hook: main
        text: "{{@~.registry.ModBlockEntities}}.register({{modBus}});"
      - include: block_assets
      - include: _tab_entry

  _client:
    ops:
      - insert: "{{javaDir}}/client/ModClient.java"
        container: |
          package {{package}}.client;

          /** Generated by FFN: client-only setup; only called on the physical client. */
          public final class ModClient {
              private ModClient() {}

              public static void register({{@ModBus}} bus) {
                  {{#if has.forgeEB7}}{{@RegisterRenderers}}.BUS.addListener(ModClient::onRegisterRenderers);{{else}}bus.addListener(ModClient::onRegisterRenderers);{{/if}}
              }

              private static void onRegisterRenderers({{@RegisterRenderers}} event) {
                  // ffn:renderers
              }
          }
      - hook: main
        text: "if ({{> tables.java.distClient}}) {{@~.client.ModClient}}.register({{modBus}});"

  entity:
    description: "A PathfinderMob with goals, attributes (EntityAttributeCreationEvent) and a placeholder renderer"
    ops:
      - include: _entity_class
      - insert: "{{javaDir}}/registry/ModEntities.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: entity types (NeoForge DeferredRegister) and their attributes. */
          public final class ModEntities {
              public static final {{@DeferredRegister}}<{{@EntityType}}<?>> ENTITIES = {{@DeferredRegister}}.create({{@Registries}}.ENTITY_TYPE, "{{modId}}");
              // ffn:fields

              private ModEntities() {}

              public static void register({{@ModBus}} bus) {
                  ENTITIES.register(bus);
                  {{#if has.forgeEB7}}{{@EntityAttributeCreationEvent}}.BUS.addListener(ModEntities::onAttributes);{{else}}bus.addListener(ModEntities::onAttributes);{{/if}}
              }

              private static void onAttributes({{@EntityAttributeCreationEvent}} event) {
                  // ffn:attributes
              }

              private static <T extends {{@Entity}}> {{@EntityType}}<T> build(String name, {{@EntityType}}.Builder<T> builder) {
                  {{#if has.entityBuildKey}}return builder.build({{@ResourceKey}}.create({{@Registries}}.ENTITY_TYPE, ModItems.id(name)));{{else}}return builder.build("{{modId}}:" + name);{{/if}}
              }
          }
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Holder}}<{{@EntityType}}<?>, {{@EntityType}}<{{@~.entity.[Name]Entity}}>> {{NAME}} = ENTITIES.register("{{name}}", () -> build("{{name}}",
                      {{@EntityType}}.Builder.of({{@~.entity.[Name]Entity}}::new, {{@MobCategory}}.{{#if params.category}}{{params.category}}{{else}}CREATURE{{/if}}).sized({{#if params.width}}{{params.width}}{{else}}0.6{{/if}}f, {{#if params.height}}{{params.height}}{{else}}0.9{{/if}}f)));
          - marker: attributes
            text: "event.put({{NAME}}.get(), {{@~.entity.[Name]Entity}}.createAttributes().build());"
      - include: _items_container
      - hook: main
        text: "{{@~.registry.ModEntities}}.register({{modBus}});"
      - include: _client
      - insert: "{{javaDir}}/client/ModClient.java"
        at:
          - marker: renderers
            text: "event.registerEntityRenderer({{@~.registry.ModEntities}}.{{NAME}}.get(), {{@NoopRenderer}}::new);"
      - lang: { "entity.{{modId}}.{{name}}": "{{displayName}}" }
      - note: "The entity uses NoopRenderer (invisible) as a placeholder: replace it with a renderer + model. Spawn it with /summon {{id}}."

  networking:
    description: "A CustomPacketPayload (StreamCodec) registered in RegisterPayloadHandlersEvent, with a handler and send helpers"
    ops:
      - requires: ["net.minecraft.network.protocol.common.custom.CustomPacketPayload$Type", "net.neoforged.neoforge.network.event.RegisterPayloadHandlersEvent#registrar("]
      - include: payload_record_codec
      - insert: "{{javaDir}}/network/ModNetworking.java"
        container: |
          package {{package}}.network;

          /** Generated by FFN: payload registration (RegisterPayloadHandlersEvent) and handlers. */
          public final class ModNetworking {
              private ModNetworking() {}

          {{> tables.java.id}}
              public static void register({{@ModBus}} bus) {
                  bus.addListener(ModNetworking::onRegisterPayloads);
              }

              private static void onRegisterPayloads({{@RegisterPayloadHandlersEvent}} event) {
                  var registrar = event.registrar("1");
                  // ffn:register
              }

              // ffn:methods
          }
        at:
          - marker: register
            unlessPresent: "{{Name}}Payload.TYPE, {{Name}}Payload.CODEC"
            text: |
              {{#if params.toServer}}registrar.playToServer({{Name}}Payload.TYPE, {{Name}}Payload.CODEC, (payload, context) -> handle{{Name}}(payload, context));
              {{/if}}{{#if params.toClient}}registrar.playToClient({{Name}}Payload.TYPE, {{Name}}Payload.CODEC, (payload, context) -> {{@Main}}.LOGGER.info("[{{modId}}] received {}", payload));
              {{/if}}
          - marker: methods
            if: params.toServer
            unlessPresent: "void handle{{Name}}("
            text: |
              /** Runs on the main thread when a client sends {{Name}}Payload. Validate everything: clients can send anything. */
              private static void handle{{Name}}({{Name}}Payload payload, {{@IPayloadContext}} context) {
                  {{@Main}}.LOGGER.info("[{{modId}}] {} sent {}", context.player().getName().getString(), payload);
              }

              /** Client side: send {{Name}}Payload to the server. */
              public static void send{{Name}}ToServer({{Name}}Payload payload) {
                  {{#if has.clientPacketDistributor}}{{@ClientPacketDistributor}}{{else}}{{@PacketDistributor}}{{/if}}.sendToServer(payload);
              }

          - marker: methods
            if: params.toClient
            unlessPresent: "void send{{Name}}("
            text: |
              /** Server side: send {{Name}}Payload to one player. */
              public static void send{{Name}}({{@ServerPlayer}} player, {{Name}}Payload payload) {
                  {{@PacketDistributor}}.sendToPlayer(player, payload);
              }

      - hook: main
        text: "{{@~.network.ModNetworking}}.register({{modBus}});"

  config:
    description: "A ModConfigSpec config registered with the mod container"
    ops:
      - write: "{{javaDir}}/config/Mod{{params.ConfigType}}Config.java"
        template: |
          package {{package}}.config;

          /** Generated by FFN: {{params.configType}} config (config/{{modId}}-{{params.configType}}.toml). Read values with NAME.get(). */
          public final class Mod{{params.ConfigType}}Config {
              private static final {{@ConfigSpec}}.Builder BUILDER = new {{@ConfigSpec}}.Builder();

          {{#each params.entries}}    public static final {{> this.valueType}} {{this.NAME}} = BUILDER.comment("{{this.comment}}").{{> this.define}};
          {{/each}}
              public static final {{@ConfigSpec}} SPEC = BUILDER.build();

              private Mod{{params.ConfigType}}Config() {}
          }
      - hook: main
        text: "{{@ModLoadingContext}}.get().getActiveContainer().registerConfig({{@ModConfig}}.Type.{{> tables.java.configTypeConstant}}, {{@~.config.Mod[params.ConfigType]Config}}.SPEC);"
      - if: '!has.cfgTypeCommon && params.configType == "common"'
        warn: "UNVERIFIED mapping: this NeoForge has no ModConfig.Type.COMMON; FFN used LOCAL (loaded on both sides, not synced). Check the NeoForge primer for your version."
      - if: '!has.cfgTypeServer && params.configType == "server"'
        warn: "UNVERIFIED mapping: this NeoForge has no ModConfig.Type.SERVER; FFN used SYNCED (synced from server to clients). Check the NeoForge primer for your version."
      - note: "If your mod constructor takes a ModContainer parameter you can use modContainer.registerConfig(...) instead."

  event_handler:
    description: "Register a handler for a common game event (params.event) on NeoForge.EVENT_BUS"
    ops:
      - insert: "{{javaDir}}/event/ModEvents.java"
        container: |
          package {{package}}.event;

          /** Generated by FFN: game event handlers. */
          public final class ModEvents {
              private ModEvents() {}

              public static void register() {
                  // ffn:register
              }

              // ffn:methods
          }
        at:
          - marker: register
            conflict: "ModEvents::{{params.handler}})"
            text: "{{> ev.register}}"
          - marker: methods
            unlessPresent: "void {{params.handler}}("
            text: |
              {{> ev.method}}
      - hook: main
        text: "{{@~.event.ModEvents}}.register();"

  datagen:
    description: "GatherDataEvent listener with an example language provider"
    ops:
      - write: "{{javaDir}}/datagen/ModDataGen.java"
        template: |
          package {{package}}.datagen;

          /** Generated by FFN: data generation entry point (mod bus GatherDataEvent). */
          public final class ModDataGen {
              private ModDataGen() {}

              public static void register({{@ModBus}} bus) {
                  bus.addListener(ModDataGen::gather);
              }

          {{#if has.gatherClient}}    private static void gather({{@GatherDataClient}} event) {
                  event.createProvider(ModLangProvider::new);
              }
          {{else}}    private static void gather({{@GatherDataEvent}} event) {
                  event.getGenerator().addProvider(event.includeClient(), new ModLangProvider(event.getGenerator().getPackOutput()));
              }
          {{/if}}}
      - write: "{{javaDir}}/datagen/ModLangProvider.java"
        template: |
          package {{package}}.datagen;

          /** Generated by FFN: an example data provider (en_us translations). */
          public class ModLangProvider extends {{@LanguageProvider}} {
              public ModLangProvider({{@PackOutput}} output) {
                  super(output, "{{modId}}", "en_us");
              }

              @Override
              protected void addTranslations() {
                  add("{{modId}}.datagen.example", "Generated by FFN datagen");
              }
          }
      - hook: main
        text: "{{@~.datagen.ModDataGen}}.register({{modBus}});"
      - note: "Run data generation with the ModDevGradle data run (runs { {{#if has.gatherClient}}clientData{{else}}data{{/if}} { {{#if has.gatherClient}}clientData(){{else}}data(){{/if}} } }) and add src/generated/resources to the main resources."
