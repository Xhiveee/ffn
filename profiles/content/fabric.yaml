# FFN content catalog — Fabric (Fabric API). Registration with Registry.register; API names probed on the classpath
# (Fabric API renamed several classes to Mojang names for 26.x, e.g. FabricItemGroup → FabricCreativeModeTab).
loader: fabric

main:
  init: onInitialize

symbols:
  FabricTab: [net.fabricmc.fabric.api.creativetab.v1.FabricCreativeModeTab, net.fabricmc.fabric.api.itemgroup.v1.FabricItemGroup]
  FabricBETypeBuilder: net.fabricmc.fabric.api.object.builder.v1.block.entity.FabricBlockEntityTypeBuilder
  FabricDefaultAttributeRegistry: net.fabricmc.fabric.api.object.builder.v1.entity.FabricDefaultAttributeRegistry
  EntityRendererRegistry: net.fabricmc.fabric.api.client.rendering.v1.EntityRendererRegistry
  ClientModInitializer: net.fabricmc.api.ClientModInitializer
  PayloadTypeRegistry: net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry
  ServerPlayNetworking: net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking
  ClientPlayNetworking: net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking
  PacketByteBufs: net.fabricmc.fabric.api.networking.v1.PacketByteBufs
  FabricLoader: net.fabricmc.loader.api.FabricLoader
  ServerTickEvents: net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents
  ServerLifecycleEvents: net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents
  ServerPlayConnectionEvents: net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents
  PlayerBlockBreakEvents: net.fabricmc.fabric.api.event.player.PlayerBlockBreakEvents
  CommandRegistrationCallback: net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback
  DataGeneratorEntrypoint: net.fabricmc.fabric.api.datagen.v1.DataGeneratorEntrypoint
  FabricDataGenerator: net.fabricmc.fabric.api.datagen.v1.FabricDataGenerator
  FabricLanguageProvider: net.fabricmc.fabric.api.datagen.v1.provider.FabricLanguageProvider
  FabricOutput: [net.fabricmc.fabric.api.datagen.v1.FabricPackOutput, net.fabricmc.fabric.api.datagen.v1.FabricDataOutput]
  CompletableFuture: java.util.concurrent.CompletableFuture
  Gson: com.google.gson.Gson
  GsonBuilder: com.google.gson.GsonBuilder
  JsonParseException: com.google.gson.JsonParseException
  Files: java.nio.file.Files
  Path: java.nio.file.Path
  IOException: java.io.IOException

probes:
  fabricServerboundPlay: "net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry#serverboundPlay("
  fabricLangLookup: "net.fabricmc.fabric.api.datagen.v1.provider.FabricLanguageProvider#generateTranslations(Lnet/minecraft/core/HolderLookup$Provider;"

tables:
  configTypes:
    int: { java: int }
    long: { java: long }
    double: { java: double }
    bool: { java: boolean }
    string: { java: String }
  events:
    server_tick:
      description: Runs at the end of every server tick
      variants:
        - requires: ["net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents#END_SERVER_TICK"]
          register: "{{@ServerTickEvents}}.END_SERVER_TICK.register(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@MinecraftServer}} server) {
                // Called at the end of every server tick (20 per second): keep it cheap.
            }
    server_started:
      description: Server finished starting
      variants:
        - requires: ["net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents#SERVER_STARTED"]
          register: "{{@ServerLifecycleEvents}}.SERVER_STARTED.register(ModEvents::{{params.handler}});"
          method: |
            private static void {{params.handler}}({{@MinecraftServer}} server) {
                {{@Main}}.LOGGER.info("[{{modId}}] server started");
            }
    player_join:
      description: A player joined the server
      variants:
        - requires: ["net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents#JOIN"]
          register: "{{@ServerPlayConnectionEvents}}.JOIN.register((handler, sender, server) -> {{params.handler}}(handler.getPlayer(), server));"
          method: |
            private static void {{params.handler}}({{@ServerPlayer}} player, {{@MinecraftServer}} server) {
                {{@Main}}.LOGGER.info("[{{modId}}] {} joined", player.getName().getString());
            }
    block_break:
      description: After a player broke a block
      variants:
        - requires: ["net.fabricmc.fabric.api.event.player.PlayerBlockBreakEvents#AFTER"]
          register: "{{@PlayerBlockBreakEvents}}.AFTER.register((level, player, pos, state, blockEntity) -> {{params.handler}}(level, player, pos, state));"
          method: |
            private static void {{params.handler}}({{@Level}} level, {{@Player}} player, {{@BlockPos}} pos, {{@BlockState}} state) {
                // React to the broken block here.
            }
    register_commands:
      description: Register a /<modid> command
      variants:
        - requires: ["net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback#EVENT", "net.minecraft.commands.CommandSourceStack#sendSuccess(Ljava/util/function/Supplier;Z)V"]
          register: "{{@CommandRegistrationCallback}}.EVENT.register((dispatcher, buildContext, selection) -> {{params.handler}}(dispatcher));"
          method: |
            private static void {{params.handler}}({{@CommandDispatcher}}<{{@CommandSourceStack}}> dispatcher) {
                dispatcher.register({{@Commands}}.literal("{{modId}}").executes(context -> {
                    context.getSource().sendSuccess(() -> {{@Component}}.literal("Hello from {{modId}}"), false);
                    return 1;
                }));
            }

  # Shared Java snippets
  java:
    id: |
      public static {{@Id}} id(String path) {
          return {{#if has.idCtor}}new {{@Id}}("{{modId}}", path){{else}}{{@Id}}.fromNamespaceAndPath("{{modId}}", path){{/if}};
      }

kinds:
  # ---------------- blocks & items ----------------
  _blocks_container:
    description: "[internal] ModBlocks + ModItems registries"
    ops:
      - insert: "{{javaDir}}/registry/ModBlocks.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: blocks registered with Registry.register. */
          public final class ModBlocks {
              // ffn:fields

              private ModBlocks() {}

              /** Called from the mod initializer; loading this class registers its blocks. */
              public static void init() {
                  // ffn:init
              }

              private static <T extends {{@Block}}> T register(String name, {{@Function}}<{{@BlockProps}}, T> factory, {{@BlockProps}} props, boolean withItem) {
                  {{@ResourceKey}}<{{@Block}}> key = {{@ResourceKey}}.create({{@Registries}}.BLOCK, ModItems.id(name));
                  T block = {{@Registry}}.register({{@BuiltInRegistries}}.BLOCK, key, factory.apply(props{{#if has.blockPropsSetId}}.setId(key){{/if}}));
                  if (withItem) ModItems.registerBlockItem(name, block);
                  return block;
              }
          }
      - hook: main
        text: "{{@~.registry.ModBlocks}}.init();"
      - include: _items_container

  _items_container:
    description: "[internal] ModItems"
    ops:
      - insert: "{{javaDir}}/registry/ModItems.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: items registered with Registry.register. */
          public final class ModItems {
              // ffn:fields

              private ModItems() {}

              public static void init() {
                  // ffn:init
              }

          {{> tables.java.id}}
              public static {{@Item}} registerBlockItem(String name, {{@Block}} block) {
                  return register(name, props -> new {{@BlockItem}}(block, props), new {{@ItemProps}}(){{#if has.itemBlockDescription}}.useBlockDescriptionPrefix(){{/if}});
              }

              public static <T extends {{@Item}}> T register(String name, {{@Function}}<{{@ItemProps}}, T> factory, {{@ItemProps}} props) {
                  {{@ResourceKey}}<{{@Item}}> key = {{@ResourceKey}}.create({{@Registries}}.ITEM, id(name));
                  return {{@Registry}}.register({{@BuiltInRegistries}}.ITEM, key, factory.apply(props{{#if has.itemPropsSetId}}.setId(key){{/if}}));
              }
          }
      - hook: main
        text: "{{@~.registry.ModItems}}.init();"

  _tab_entry:
    description: "[internal] add the generated thing to a generated creative tab"
    ops:
      - if: params.tab
        insert: "{{javaDir}}/registry/ModCreativeTabs.java"
        id: creative tab (generate kind=creative_tab first)
        at:
          - marker: "tab_{{params.tab}}"
            text: 'output.accept({{#eq kind "item"}}ModItems{{else}}ModBlocks{{/eq}}.{{NAME}});'

  block:
    description: "A simple block with its block item, blockstate, models, texture, loot table and translation"
    ops:
      - include: _blocks_container
      - insert: "{{javaDir}}/registry/ModBlocks.java"
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Block}} {{NAME}} = register("{{name}}", {{@Block}}::new, {{@BlockProps}}.of().strength({{#if params.strength}}{{params.strength}}{{else}}1.5{{/if}}f){{#if params.lightLevel}}.lightLevel(state -> {{params.lightLevel}}){{/if}}, true);
      - include: block_assets
      - include: _tab_entry

  item:
    description: "A simple item with model, texture and translation"
    ops:
      - include: _items_container
      - insert: "{{javaDir}}/registry/ModItems.java"
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Item}} {{NAME}} = register("{{name}}", {{@Item}}::new, new {{@ItemProps}}(){{#if params.stackSize}}.stacksTo({{params.stackSize}}){{/if}});
      - include: item_assets
      - include: _tab_entry

  creative_tab:
    description: "A creative mode tab listing items (params.items, params.icon); later blocks/items can join it with params.tab"
    ops:
      - insert: "{{javaDir}}/registry/ModCreativeTabs.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: creative mode tabs. */
          public final class ModCreativeTabs {
              // ffn:fields

              private ModCreativeTabs() {}

              public static void init() {
              }

              private static {{@Item}} item(String id) {
                  return {{@BuiltInRegistries}}.ITEM.{{#if has.registryGetValue}}getValue{{else}}get{{/if}}({{@Id}}.tryParse(id));
              }
          }
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@CreativeModeTab}} {{NAME}} = {{@Registry}}.register({{@BuiltInRegistries}}.CREATIVE_MODE_TAB, ModItems.id("{{name}}"),
                      {{@FabricTab}}.builder()
                              .title({{@Component}}.translatable("itemGroup.{{modId}}.{{name}}"))
                              .icon(() -> new {{@ItemStack}}(item("{{#if params.icon}}{{params.icon}}{{else}}minecraft:book{{/if}}")))
                              .displayItems((parameters, output) -> {
              {{#each params.items}}                    output.accept(item("{{this.id}}"));
              {{/each}}                    // ffn:tab_{{name}}
                              })
                              .build());
      - include: _items_container
      - hook: main
        text: "{{@~.registry.ModCreativeTabs}}.init();"
      - lang: { "itemGroup.{{modId}}.{{name}}": "{{displayName}}" }

  # ---------------- block entities ----------------
  block_entity:
    description: "A block with a ticking block entity that persists a counter (shows the version's save/load API)"
    ops:
      - include: _blocks_container
      - write: "{{javaDir}}/block/{{Name}}Block.java"
        template: |
          package {{package}}.block;

          /** Generated by FFN: a block that owns a {{Name}}BlockEntity. */
          public class {{Name}}Block extends {{@Block}} implements {{@EntityBlock}} {
              public {{Name}}Block({{@BlockProps}} properties) {
                  super(properties);
              }

              @Override
              public {{@BlockEntity}} newBlockEntity({{@BlockPos}} pos, {{@BlockState}} state) {
                  return new {{Name}}BlockEntity(pos, state);
              }

              @Override
              public <T extends {{@BlockEntity}}> {{@BlockEntityTicker}}<T> getTicker({{@Level}} level, {{@BlockState}} state, {{@BlockEntityType}}<T> type) {
                  if ({{#if has.levelIsClientSideMethod}}level.isClientSide(){{else}}level.isClientSide{{/if}}) return null;
                  return (lvl, pos, st, be) -> {
                      if (be instanceof {{Name}}BlockEntity entity) entity.serverTick();
                  };
              }
          }
      - write: "{{javaDir}}/block/{{Name}}BlockEntity.java"
        template: &beClass |
          package {{package}}.block;

          /** Generated by FFN: counts server ticks and saves the counter with the world. */
          public class {{Name}}BlockEntity extends {{@BlockEntity}} {
              private int ticks;

              public {{Name}}BlockEntity({{@BlockPos}} pos, {{@BlockState}} state) {
                  super({{@~.registry.ModBlockEntities}}.{{NAME}}{{#eq loader "fabric"}}{{else}}.get(){{/eq}}, pos, state);
              }

              public void serverTick() {
                  ticks++;
                  if (ticks % 100 == 0) setChanged();
              }

              public int getTicks() {
                  return ticks;
              }
          {{#if has.beValueIO}}
              @Override
              protected void saveAdditional({{@ValueOutput}} output) {
                  super.saveAdditional(output);
                  output.putInt("ticks", ticks);
              }

              @Override
              protected void loadAdditional({{@ValueInput}} input) {
                  super.loadAdditional(input);
                  ticks = input.getIntOr("ticks", 0);
              }
          {{else}}{{#if has.beLookup}}
              @Override
              protected void saveAdditional({{@CompoundTag}} tag, {{@HolderLookup}}.Provider registries) {
                  super.saveAdditional(tag, registries);
                  tag.putInt("ticks", ticks);
              }

              @Override
              protected void loadAdditional({{@CompoundTag}} tag, {{@HolderLookup}}.Provider registries) {
                  super.loadAdditional(tag, registries);
                  ticks = tag.getInt("ticks");
              }
          {{else}}
              @Override
              protected void saveAdditional({{@CompoundTag}} tag) {
                  super.saveAdditional(tag);
                  tag.putInt("ticks", ticks);
              }

              @Override
              public void load({{@CompoundTag}} tag) {
                  super.load(tag);
                  ticks = tag.getInt("ticks");
              }
          {{/if}}{{/if}}}
      - insert: "{{javaDir}}/registry/ModBlocks.java"
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@Block}} {{NAME}} = register("{{name}}", {{@~.block.[Name]Block}}::new, {{@BlockProps}}.of().strength(2.0f), true);
      - insert: "{{javaDir}}/registry/ModBlockEntities.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: block entity types. */
          public final class ModBlockEntities {
              // ffn:fields

              private ModBlockEntities() {}

              public static void init() {
              }
          }
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@BlockEntityType}}<{{@~.block.[Name]BlockEntity}}> {{NAME}} = {{@Registry}}.register({{@BuiltInRegistries}}.BLOCK_ENTITY_TYPE, ModItems.id("{{name}}"),
                      {{#if has.beTypeCtor}}new {{@BlockEntityType}}<>({{@~.block.[Name]BlockEntity}}::new, {{@Set}}.of(ModBlocks.{{NAME}})){{else}}{{@FabricBETypeBuilder}}.create({{@~.block.[Name]BlockEntity}}::new, ModBlocks.{{NAME}}).build(){{/if}});
      - hook: main
        text: "{{@~.registry.ModBlockEntities}}.init();"
      - include: block_assets
      - include: _tab_entry

  # ---------------- entities ----------------
  _client_entrypoint:
    description: "[internal] client entrypoint"
    ops:
      - insert: "{{javaDir}}/client/{{ModPrefix}}Client.java"
        container: |
          package {{package}}.client;

          /** Generated by FFN: client-only setup (registered as the "client" entrypoint in fabric.mod.json). */
          public class {{ModPrefix}}Client implements {{@ClientModInitializer}} {
              @Override
              public void onInitializeClient() {
                  // ffn:client
              }

              // ffn:methods
          }
      - json: "{{resDir}}/fabric.mod.json"
        merge: '{"entrypoints": {"client": ["{{package}}.client.{{ModPrefix}}Client"]}}'

  entity:
    description: "A PathfinderMob with goals, attributes and a placeholder (invisible) renderer"
    ops:
      - write: "{{javaDir}}/entity/{{Name}}Entity.java"
        template: &entityClass |
          package {{package}}.entity;

          /** Generated by FFN: a simple wandering mob. */
          public class {{Name}}Entity extends {{@PathfinderMob}} {
              public {{Name}}Entity({{@EntityType}}<? extends {{@PathfinderMob}}> type, {{@Level}} level) {
                  super(type, level);
              }

              public static {{@AttributeSupplier}}.Builder createAttributes() {
                  return {{@Mob}}.createMobAttributes()
                          .add({{@Attributes}}.MAX_HEALTH, {{#if params.health}}{{params.health}}{{else}}10.0{{/if}})
                          .add({{@Attributes}}.MOVEMENT_SPEED, {{#if params.speed}}{{params.speed}}{{else}}0.25{{/if}});
              }

              @Override
              protected void registerGoals() {
                  this.goalSelector.addGoal(0, new {{@FloatGoal}}(this));
                  this.goalSelector.addGoal(1, new {{@RandomStrollGoal}}(this, 1.0));
                  this.goalSelector.addGoal(2, new {{@LookAtPlayerGoal}}(this, {{@Player}}.class, 6.0f));
                  this.goalSelector.addGoal(3, new {{@RandomLookAroundGoal}}(this));
              }
          }
      - insert: "{{javaDir}}/registry/ModEntities.java"
        container: |
          package {{package}}.registry;

          /** Generated by FFN: entity types. */
          public final class ModEntities {
              // ffn:fields

              private ModEntities() {}

              public static void init() {
                  // ffn:init
              }

              private static <T extends {{@Entity}}> {{@EntityType}}<T> register(String name, {{@EntityType}}.Builder<T> builder) {
                  {{@ResourceKey}}<{{@EntityType}}<?>> key = {{@ResourceKey}}.create({{@Registries}}.ENTITY_TYPE, ModItems.id(name));
                  return {{@Registry}}.register({{@BuiltInRegistries}}.ENTITY_TYPE, key, builder.build({{#if has.entityBuildKey}}key{{else}}key.{{#if has.keyIdentifier}}identifier{{else}}location{{/if}}().toString(){{/if}}));
              }
          }
        at:
          - marker: fields
            conflict: " {{NAME}} ="
            text: |
              public static final {{@EntityType}}<{{@~.entity.[Name]Entity}}> {{NAME}} = register("{{name}}",
                      {{@EntityType}}.Builder.of({{@~.entity.[Name]Entity}}::new, {{@MobCategory}}.{{#if params.category}}{{params.category}}{{else}}CREATURE{{/if}}).sized({{#if params.width}}{{params.width}}{{else}}0.6{{/if}}f, {{#if params.height}}{{params.height}}{{else}}0.9{{/if}}f));
          - marker: init
            text: "{{@FabricDefaultAttributeRegistry}}.register({{NAME}}, {{@~.entity.[Name]Entity}}.createAttributes());"
      - include: _items_container
      - hook: main
        text: "{{@~.registry.ModEntities}}.init();"
      - include: _client_entrypoint
      - insert: "{{javaDir}}/client/{{ModPrefix}}Client.java"
        at:
          - marker: client
            text: "{{@EntityRendererRegistry}}.register({{@~.registry.ModEntities}}.{{NAME}}, {{@NoopRenderer}}::new);"
      - lang: { "entity.{{modId}}.{{name}}": "{{displayName}}" }
      - note: "The entity uses NoopRenderer (invisible) as a placeholder: replace it with a renderer + model for your mob. Spawn it with /summon {{id}}."

  # ---------------- networking ----------------
  networking:
    description: "A custom payload/packet with registration, a server/client handler and send helpers (CustomPacketPayload + StreamCodec on 1.20.5+, FriendlyByteBuf channels before)"
    ops:
      - include: networking_payload_class
      - insert: "{{javaDir}}/network/ModNetworking.java"
        container: |
          package {{package}}.network;

          /** Generated by FFN: payload registration and server-side handlers. */
          public final class ModNetworking {
              private ModNetworking() {}

          {{> tables.java.id}}
              public static void init() {
                  // ffn:register
              }

              // ffn:methods
          }
        at:
          - marker: register
            if: has.payloads
            unlessPresent: "{{Name}}Payload.TYPE, {{Name}}Payload.CODEC"
            text: |
              {{#if params.toServer}}{{@PayloadTypeRegistry}}.{{#if has.fabricServerboundPlay}}serverboundPlay{{else}}playC2S{{/if}}().register({{Name}}Payload.TYPE, {{Name}}Payload.CODEC);
              {{@ServerPlayNetworking}}.registerGlobalReceiver({{Name}}Payload.TYPE, (payload, context) -> handle{{Name}}(payload, context.player()));
              {{/if}}{{#if params.toClient}}{{@PayloadTypeRegistry}}.{{#if has.fabricServerboundPlay}}clientboundPlay{{else}}playS2C{{/if}}().register({{Name}}Payload.TYPE, {{Name}}Payload.CODEC);
              {{/if}}
      - insert: "{{javaDir}}/network/ModNetworking.java"
        unless: has.payloads
        at:
          - marker: register
            unlessPresent: "({{Name}}Payload.ID"
            text: |
              {{#if params.toServer}}{{@ServerPlayNetworking}}.registerGlobalReceiver({{Name}}Payload.ID, (server, player, handler, buf, responseSender) -> {
                  {{Name}}Payload payload = {{Name}}Payload.read(buf);
                  server.execute(() -> handle{{Name}}(payload, player));
              });
              {{/if}}
      - insert: "{{javaDir}}/network/ModNetworking.java"
        at:
          - marker: methods
            if: params.toServer
            unlessPresent: "void handle{{Name}}("
            text: |
              /** Runs on the server thread when a client sends {{Name}}Payload. Validate everything: clients can send anything. */
              private static void handle{{Name}}({{Name}}Payload payload, {{@ServerPlayer}} player) {
                  {{@Main}}.LOGGER.info("[{{modId}}] {} sent {}", player.getName().getString(), payload);
              }

          - marker: methods
            if: params.toClient
            unlessPresent: "void send{{Name}}("
            text: |
              /** Send {{Name}}Payload to one player (server side). */
              public static void send{{Name}}({{@ServerPlayer}} player, {{Name}}Payload payload) {
              {{#if has.payloads}}    {{@ServerPlayNetworking}}.send(player, payload);
              {{else}}    {{@FriendlyByteBuf}} buf = {{@PacketByteBufs}}.create();
                  payload.write(buf);
                  {{@ServerPlayNetworking}}.send(player, {{Name}}Payload.ID, buf);
              {{/if}}}

      - hook: main
        text: "{{@~.network.ModNetworking}}.init();"
      - include: _client_entrypoint
      - insert: "{{javaDir}}/client/{{ModPrefix}}Client.java"
        at:
          - marker: client
            if: params.toClient
            text: |
              {{#if has.payloads}}{{@ClientPlayNetworking}}.registerGlobalReceiver({{@~.network.[Name]Payload}}.TYPE, (payload, context) -> {{@Main}}.LOGGER.info("[{{modId}}] received {}", payload));{{else}}{{@ClientPlayNetworking}}.registerGlobalReceiver({{@~.network.[Name]Payload}}.ID, (client, handler, buf, responseSender) -> {
                  {{@~.network.[Name]Payload}} payload = {{@~.network.[Name]Payload}}.read(buf);
                  client.execute(() -> {{@Main}}.LOGGER.info("[{{modId}}] received {}", payload));
              });{{/if}}
          - marker: methods
            if: params.toServer
            text: |
              /** Send {{Name}}Payload to the server (client side). */
              public static void send{{Name}}({{@~.network.[Name]Payload}} payload) {
              {{#if has.payloads}}    {{@ClientPlayNetworking}}.send(payload);
              {{else}}    {{@FriendlyByteBuf}} buf = {{@PacketByteBufs}}.create();
                  payload.write(buf);
                  {{@ClientPlayNetworking}}.send({{@~.network.[Name]Payload}}.ID, buf);
              {{/if}}}

  # ---------------- config ----------------
  config:
    description: "A JSON config file in the Fabric config dir (Fabric has no built-in config API; uses Gson shipped with Minecraft)"
    ops:
      - write: "{{javaDir}}/config/Mod{{params.ConfigType}}Config.java"
        template: |
          package {{package}}.config;

          /** Generated by FFN: {{params.configType}} config stored as config/{{modId}}-{{params.configType}}.json. */
          public final class Mod{{params.ConfigType}}Config {
              private static final {{@Gson}} GSON = new {{@GsonBuilder}}().setPrettyPrinting().create();
              private static final {{@Path}} FILE = {{@FabricLoader}}.getInstance().getConfigDir().resolve("{{modId}}-{{params.configType}}.json");

              /** Current values; replaced on load(). */
              public static Values VALUES = new Values();

              public static final class Values {
          {{#each params.entries}}        /** {{this.comment}} */
                  public {{this.java}} {{this.camel}} = {{this.defaultLiteral}};
          {{/each}}    }

              private Mod{{params.ConfigType}}Config() {}

              public static void load() {
                  try {
                      if ({{@Files}}.exists(FILE)) {
                          Values read = GSON.fromJson({{@Files}}.readString(FILE), Values.class);
                          if (read != null) VALUES = read;
                      }
          {{#each params.entries}}{{#if this.hasRange}}            VALUES.{{this.camel}} = Math.max({{this.min}}, Math.min({{this.max}}, VALUES.{{this.camel}}));
          {{/if}}{{/each}}            save();
                  } catch ({{@IOException}} | {{@JsonParseException}} e) {
                      {{@Main}}.LOGGER.warn("[{{modId}}] could not read {}: {}", FILE, e.toString());
                  }
              }

              public static void save() {
                  try {
                      {{@Files}}.createDirectories(FILE.getParent());
                      {{@Files}}.writeString(FILE, GSON.toJson(VALUES));
                  } catch ({{@IOException}} e) {
                      {{@Main}}.LOGGER.warn("[{{modId}}] could not write {}: {}", FILE, e.toString());
                  }
              }
          }
      - hook: main
        text: "{{@~.config.Mod[params.ConfigType]Config}}.load();"

  # ---------------- events ----------------
  event_handler:
    description: "Register a handler for a common event (params.event: see tables.events)"
    ops:
      - insert: "{{javaDir}}/event/ModEvents.java"
        container: |
          package {{package}}.event;

          /** Generated by FFN: event handlers registered with Fabric API callbacks. */
          public final class ModEvents {
              private ModEvents() {}

              public static void init() {
                  // ffn:register
              }

              // ffn:methods
          }
        at:
          - marker: register
            conflict: "ModEvents::{{params.handler}})"
            text: "{{> ev.register}}"
          - marker: methods
            unlessPresent: "void {{params.handler}}("
            text: |
              {{> ev.method}}
      - hook: main
        text: "{{@~.event.ModEvents}}.init();"

  # ---------------- data generation ----------------
  datagen:
    description: "Fabric data generation setup: DataGeneratorEntrypoint + a language provider, fabric-datagen entrypoint and Loom's runDatagen"
    ops:
      - write: "{{javaDir}}/datagen/ModDataGenerator.java"
        template: |
          package {{package}}.datagen;

          /** Generated by FFN: run with ./gradlew runDatagen; output goes to src/main/generated. */
          public class ModDataGenerator implements {{@DataGeneratorEntrypoint}} {
              @Override
              public void onInitializeDataGenerator({{@FabricDataGenerator}} generator) {
                  {{@FabricDataGenerator}}.Pack pack = generator.createPack();
                  pack.addProvider(ModLangProvider::new);
              }
          }
      - write: "{{javaDir}}/datagen/ModLangProvider.java"
        template: |
          package {{package}}.datagen;

          /** Generated by FFN: an example data provider (en_us translations). */
          public class ModLangProvider extends {{@FabricLanguageProvider}} {
          {{#if has.fabricLangLookup}}    public ModLangProvider({{@FabricOutput}} output, {{@CompletableFuture}}<{{@HolderLookup}}.Provider> registries) {
                  super(output, registries);
              }

              @Override
              public void generateTranslations({{@HolderLookup}}.Provider registries, TranslationBuilder builder) {
          {{else}}    public ModLangProvider({{@FabricOutput}} output) {
                  super(output);
              }

              @Override
              public void generateTranslations(TranslationBuilder builder) {
          {{/if}}        builder.add("{{modId}}.datagen.example", "Generated by FFN datagen");
              }
          }
      - json: "{{resDir}}/fabric.mod.json"
        merge: '{"entrypoints": {"fabric-datagen": ["{{package}}.datagen.ModDataGenerator"]}}'
      - gradle: build.gradle
        text: |
          fabricApi {
              configureDataGeneration()
          }
      - note: "Run ./gradlew runDatagen. Loom writes generated resources to src/main/generated and adds that folder to the main resources."
